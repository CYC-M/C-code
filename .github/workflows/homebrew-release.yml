name: Build C-code Release Assets

on:
  push:
    tags:
      - 'cc-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build release binaries
        run: |
          npm run build:offline
          ./scripts/build-binaries.sh --skip-install --skip-build --out release-assets

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum pi-*.tar.gz pi-*.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "C-code $RELEASE_TAG" \
            --generate-notes \
            release-assets/pi-*.tar.gz \
            release-assets/pi-*.zip \
            release-assets/SHA256SUMS
